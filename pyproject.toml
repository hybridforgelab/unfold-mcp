[project]
name = "hybridforgelab-unfold-mcp"
version = "0.1.0"
description = "PDF, DOCX, PPTX and XLSX documents to Markdown for LLM agents, from a URL or a local file. Bring your own RapidAPI or api.market key."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Hybrid Forge Lab", email = "hybridforgelab@gmail.com" }]
dependencies = ["mcp>=2.3,<3", "httpx>=0.27"]

[project.urls]
Homepage = "https://unfold.hybridforgelab.com"

[project.scripts]
unfold-mcp = "unfold_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unfold_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q --cov=unfold_mcp --cov-report=term-missing:skip-covered --cov-fail-under=100"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
